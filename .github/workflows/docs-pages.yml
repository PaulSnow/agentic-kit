# Owner-approved Starter publication; continuous deployment defaults off.
name: Documentation Pages
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact locally validated pushed commit
        required: true
        type: string
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.DOCS_CONTINUOUS == 'on' && github.ref_name == (vars.DOCS_RELEASE_BRANCH || 'master'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # https://github.com/actions/checkout/releases/tag/v4.2.2
      - name: Provision pinned build prerequisites
        run: |
          python3 -m pip install --user uv==0.9.26
          rustup toolchain install 1.91.1 --profile minimal
      - name: Build and validate curated manual
        env:
          DOCS_VALIDATED_COMMIT: ${{ inputs.candidate }}
        run: |
          ./bin/docs setup
          ./bin/docs check --release
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # https://github.com/actions/configure-pages/releases/tag/v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # https://github.com/actions/upload-pages-artifact/releases/tag/v3.0.1
        with:
          path: .kickoff/manual
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated book artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # https://github.com/actions/deploy-pages/releases/tag/v4.0.5
