[book]
title = "Agentic Coding Starter Manual"
authors = ["Wolf McNally"]
description = "Use the Starter methodology, skills, and tools to build software with coding agents."
language = "en"
src = "src"

[build]
build-dir = "../.kickoff/manual"
create-missing = false

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.3" # do not edit: managed by `mdbook-admonish install`
on_failure = "bail"

[output.html]
site-url = "/agentic-coding-starter/"
additional-css = ["mdbook-admonish.css"]

[output.html.playground]
runnable = false

[output.html.search]
enable = true

[output.html.print]
enable = true
